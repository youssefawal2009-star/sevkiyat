<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' blob: data: https://paojawgjfckmavwzwzhl.supabase.co wss://paojawgjfckmavwzwzhl.supabase.co https://api.zippopotam.us https://nominatim.openstreetmap.org https://routing.openstreetmap.de https://router.project-osrm.org; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sevkiyat Planlayıcı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="lib/leaflet-1.9.4.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: beyaz zemin, ortada dar sütun; büyük yuvarlak kartlar, turuncu daire ikonlar, hap biçimli büyük butonlar. */
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f6f6f7; --line:#ebebee;
  --fg:#141416; --muted:#6c6c75; --accent:#f54e00; --accent-fg:#ffffff; --accent-soft:#fff1e9;
  --ok:#15803d; --ok-soft:#e5f6eb; --warn:#b45309; --warn-soft:#fdf2e1; --bad:#c62828; --bad-soft:#fdeaea;
  --o1:#f54e00; --o2:#f54e00; --o3:#f54e00; --sea:#dbe8f4; --land:#fbfaf8; --border:#aab6c4;
  --shadow:0 8px 28px rgba(20,20,30,.06); --glow:0 12px 26px rgba(245,78,0,.28);
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 6px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted)}
.who b{color:var(--fg)}
.demo-badge{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:99px}
main{padding-block:18px 70px;display:grid;gap:22px}
h2{font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.ic{width:22px;height:22px;flex:none}
/* Ana sayfa */
.home{max-width:760px;width:100%;margin:20px auto 0;display:grid;gap:22px}
.hcard{display:flex;align-items:center;gap:22px;padding:26px 28px;border:1.5px solid var(--line);border-radius:40px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.hcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.hcard .t{font-weight:800;font-size:26px;letter-spacing:-.02em}
.hcard .d{color:var(--muted);font-size:18px;margin-top:2px}
.bubble{width:66px;height:66px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none;box-shadow:var(--glow)}
.bubble .ic{width:28px;height:28px}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
/* Butonlar */
.btn{font:700 15px var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 8px rgba(20,20,30,.04)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.big{font-size:21px;font-weight:600;padding:22px 28px;width:100%}
.btn.big .ic{width:26px;height:26px}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 12px;font-size:13px;box-shadow:none}
.btn.ghost{border-color:transparent;box-shadow:none;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.back{align-self:start;justify-self:start}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:32px;padding:26px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
input[type=text],input[type=number],input[type=password],select{font:500 17px var(--f-body);padding:12px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);color:var(--fg);min-width:0;width:100%}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* Anket adımları */
.steps{display:grid;gap:22px}
.step{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start}
.step .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-weight:800;font-size:16px}
.step.done .n{background:var(--accent-soft);color:var(--accent)}
.step.active .n{background:var(--accent);color:var(--accent-fg);box-shadow:var(--glow)}
.step .body{display:grid;gap:10px;min-width:0}
.step .q{font-weight:700;font-size:18px}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.addform{max-width:560px;width:100%;margin:0 auto}
.form-col{width:100%;display:grid;gap:10px}
.form-col .choices.multi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form-col .choices{display:grid;grid-template-columns:repeat(3,1fr)}
.form-col .choices.two{grid-template-columns:repeat(2,1fr)}
.form-col .choice{justify-content:center;padding:13px 8px}
.form-col input{height:52px}
.fld{max-width:200px;height:52px}
.btn.toggle{height:52px;border-style:dashed;font-size:16px}.btn.toggle[aria-pressed="true"]{border-style:solid}
.cnt{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:1px 8px;font-size:13px}
.choice{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:11px 20px;font:600 16px var(--f-body);cursor:pointer;display:flex;align-items:center;gap:8px}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.msg{padding:11px 16px;border-radius:16px;font-weight:600;font-size:15px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
/* Tablolar */
.tbl{overflow-x:auto;border:1.5px solid var(--line);border-radius:28px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:14px 16px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td input[type=text],td input[type=number],td select{font-size:15px;padding:8px 10px;border-radius:12px;min-width:80px}
.owner{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.pc{font-family:var(--f-mono);font-weight:600}
.cc{font:700 11px var(--f-mono);background:var(--soft);color:var(--muted);padding:3px 6px;border-radius:6px;margin-right:7px}
.city{color:var(--muted);font-size:14px}
.stopno{font-weight:800;font-size:14px;width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent);color:var(--accent-fg)}
.cost{display:grid;gap:14px}
.cost-f{grid-template-columns:repeat(4,1fr);margin-top:0}
.cost-q{font-weight:700;font-size:16px}
.xrow{display:grid;grid-template-columns:1fr 120px 46px;gap:8px}.xrow input{height:46px;font-size:16px;padding:10px 12px;border-radius:14px}.xrow .btn{height:46px;font-size:20px;padding:0}
.fixed .xs{text-transform:none;letter-spacing:0;font-weight:600}
.fixed .net{background:var(--accent-soft)}.fixed .net dt,.fixed .net dd{color:var(--accent)}.fixed .net dd{font-size:20px;font-weight:800}
.shares{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:4px}
.share{border:1.5px solid var(--line);border-radius:22px;padding:14px 16px;display:grid;gap:6px}
.sh-top{display:grid;gap:2px;margin-bottom:4px}.sh-top b{font-size:17px}.sh-top span{color:var(--muted);font-weight:600;font-size:13px}
.sh-row{display:flex;justify-content:space-between;gap:8px;font-weight:600;color:var(--muted)}.sh-row b{color:var(--fg);font-variant-numeric:tabular-nums}
.sh-row.fin{border-top:1.5px solid var(--line);padding-top:8px;margin-top:2px;color:var(--fg)}.sh-row.fin b{color:var(--accent);font-size:20px;font-weight:800}
@media (max-width:600px){.cost-f{grid-template-columns:1fr 1fr}.xrow{grid-template-columns:1fr 96px 46px}}
.lgroup{display:grid;gap:10px}.lgroup h3{font-size:17px}
.loglist{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;overflow:hidden}
.lrow{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 16px;align-items:start}.lrow+.lrow{border-top:1px solid var(--line)}
.ltime{font:600 14px var(--f-mono);color:var(--muted);padding-top:1px}
.lbody{display:grid;gap:2px;min-width:0}.lbody b{font-size:15px}.lbody span{color:var(--muted);font-weight:500;font-size:15px;overflow-wrap:anywhere}
.login .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.login .choice{justify-content:center;padding:11px 6px}
.alist{display:grid;gap:10px}
.acard{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.a-main{display:grid;gap:4px;min-width:0}.a-addr .pc{font-size:17px}.a-addr .city{font-weight:600}
.a-meta{color:var(--muted);font-weight:600;font-size:14px}.a-meta b{color:var(--fg)}
.a-confirm{display:flex;gap:8px;margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:34px 12px}
.loadbar{display:flex;height:30px;border-radius:999px;overflow:hidden;background:var(--soft)}
.loadbar span{display:grid;place-items:center;color:#fff;font:700 12px var(--f-mono);border-right:2px solid var(--surface);min-width:0;overflow:hidden;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:22px;padding:14px 18px}
.stat b{display:block;font-weight:800;font-size:24px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.map{width:100%;max-width:100%;height:auto;background:var(--soft);border-radius:24px}
.lmap{height:380px;overflow:hidden;z-index:0;isolation:isolate;font-family:var(--f-body)}
@media (max-width:600px){.lmap{height:320px}}
.mk{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font:800 12px var(--f-body);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mk-s{border-radius:6px;background:var(--fg)}
.lmap .leaflet-control-attribution{font-size:10px}
.cards{display:grid;gap:14px}
.vcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:30px;padding:18px 22px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;box-shadow:var(--shadow)}
.vcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.vcard .bubble{width:50px;height:50px;box-shadow:none}.vcard .bubble .ic{width:22px;height:22px}
.vcard .t{font-weight:800;font-size:19px}
.note{font-size:14px;color:var(--muted)}
.pill{font:700 12px var(--f-body);padding:5px 11px;border-radius:99px;white-space:nowrap}
.pill.p1{background:var(--accent-soft);color:var(--accent)}
.pill.p2{background:var(--warn-soft);color:var(--warn)}
.pill.p3{background:var(--ok-soft);color:var(--ok)}
.pickers{display:grid;gap:4px;max-height:280px;overflow:auto;border:1.5px solid var(--line);border-radius:20px;padding:8px}
.pick{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;cursor:pointer;font-weight:500;flex-wrap:wrap}
.pick:hover{background:var(--soft)}
.pick input{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.confirm{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:20px;font-weight:600}
.summary{background:var(--surface);border:1.5px solid var(--line);border-radius:32px;box-shadow:var(--shadow);overflow:hidden}
.sum-top{display:grid;grid-template-columns:1fr 1fr}
.sum-top>div{padding:20px 26px}.sum-top>div+div{border-left:1.5px solid var(--line)}
.sum-top small,.sum-name{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.sum-top b{display:block;font-weight:800;font-size:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sum-top b span{font-size:18px;font-weight:600;color:var(--muted)}
.sub{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1.5px solid var(--line);display:grid;gap:8px}
.sub li{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600;color:var(--muted)}
.sum-top .sub b{display:inline;font-size:15px;font-weight:700;color:var(--fg);letter-spacing:0}
@media (max-width:600px){.sum-top>div{padding:16px 18px}.sum-top b{font-size:28px}.sub li{font-size:14px}.sum-top .sub b{font-size:14px}}
/* Durak kartları */
.stops{list-style:none;margin:0;padding:0;display:grid;gap:10px;position:relative}
.stops::before{content:"";position:absolute;left:17px;top:24px;bottom:24px;width:2px;background:repeating-linear-gradient(var(--accent) 0 6px,transparent 6px 11px);opacity:.5}
.stop{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;position:relative}
.sn{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:15px;margin-top:10px;box-shadow:0 0 0 4px var(--surface)}
.sn.sq{border-radius:9px;background:var(--fg);color:var(--bg)}
.sc{background:var(--soft);border-radius:22px;padding:12px 16px;display:grid;gap:4px;min-width:0}
.stop.start .sc{background:none;border:1.5px dashed var(--line)}
.sl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sl .pc{font-size:17px}.sl .ct{color:var(--muted);font-weight:600}
.big{font-weight:800;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}.big small{font-size:13px;font-weight:600;color:var(--muted)}
.sm{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;font-weight:500}
.sf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.sf .wide{grid-column:1/-1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:none;font:600 15px var(--f-body);color:var(--muted);padding:10px 6px;border-radius:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sf label{display:grid;grid-template-rows:1fr auto;align-items:end;gap:4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:0}
.sf input,.sf select{font-size:16px;padding:10px 12px;border-radius:14px;height:46px;width:100%;background:var(--surface);box-sizing:border-box}
.fixed{margin:0;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.fixed>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px}
.fixed>div+div{border-top:1px solid var(--line)}
.fixed dt{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fixed dd{margin:0;font-weight:700;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.fixed .ct{color:var(--muted);font-weight:600}
.sa{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
@media (max-width:600px){.sf{grid-template-columns:1fr 1fr;gap:10px}.sf .wide-m{grid-column:1/-1}.sf input,.sf select{padding:10px}.sc{padding:12px 14px}
 .stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px 14px;border-radius:18px}.stat b{font-size:20px}}
.sa .danger{margin-left:auto}
.pdfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.pdfrow .btn{height:58px;font-size:16px}
@media (max-width:520px){.pdfrow{grid-template-columns:1fr}}
.btnrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.btnrow .btn{white-space:nowrap}.btnrow .primary{height:58px;font-size:17px}.btnrow .danger{height:58px;padding:0 18px;font-size:14px;box-shadow:none}
.delrow{display:flex;justify-content:center}.delrow:empty{display:none}
/* Seçenek kartları (araç önerileri) */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{border:1.5px solid var(--line);border-radius:26px;padding:16px 18px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;gap:4px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.opt .lbl{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.opt .km{font-weight:800;font-size:26px;letter-spacing:-.02em}
.opt .sv{font-weight:700;color:var(--ok);font-size:14px}
/* Giriş */
.net{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bad);color:#fff;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;z-index:50}
.login{max-width:460px;margin:40px auto 0;display:grid;gap:18px}
/* Sürücü belgesi (A4 önizleme) */
.sheet-wrap{overflow-x:auto;background:var(--soft);border-radius:28px;padding:18px}
.sheet{width:760px;margin:0 auto;background:#fff;color:#111;padding:36px 38px;box-shadow:0 2px 14px rgba(0,0,0,.15);font-family:var(--f-body)}
.sheet h4{font-weight:800;font-size:24px;margin:0}
.sheet .meta{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:14px;font-size:13px}
.sheet table{font-size:12.5px}
.sheet th{background:#f1f1f3;color:#333;border-bottom:1px solid #999;padding:8px 10px}
.sheet td{border-bottom:1px solid #ccc;color:#111;padding:8px 10px}
.sheet .code{font:700 15px var(--f-mono);border:1.5px solid #111;padding:2px 6px;border-radius:3px;white-space:nowrap}
.sheet .sig{display:flex;gap:40px;margin-top:40px;font-size:12px;color:#444}
.sheet .sig div{flex:1;border-top:1px solid #444;padding-top:6px}
@media (max-width:600px){
  .bigbtns{grid-template-columns:1fr;gap:14px}
  .topbar{flex-wrap:nowrap}.who .demo-badge{display:none}
  .hcard{border-radius:30px;padding:20px;gap:16px}.hcard .t{font-size:21px}.hcard .d{font-size:15px}

function hav(p,q){const R=6371,r=Math.PI/180,dl=(q.lat-p.lat)*r,dn=(q.lon-p.lon)*r;const h=Math.sin(dl/2)**2+Math.cos(p.lat*r)*Math.cos(q.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

function pathLen(pts){let s=0,prev=SUBEN;for(const p of pts){s+=dist(prev,p);prev=p}return s}

function bestOrder(ids){
  const pts=ids.map(id=>({id,...geo(A(id))}));
  if(pts.length<2)return {order:pts.map(p=>p.id),km:pathLen(pts)};
  let rest=[...pts],cur=SUBEN,route=[];
  while(rest.length){let bi=0,bd=1e18;rest.forEach((p,i)=>{const d=dist(cur,p);if(d<bd){bd=d;bi=i}});cur=rest[bi];route.push(cur);rest.splice(bi,1)}

  while(improved&&guard++<200){improved=false;
    for(let i=0;i<route.length-1;i++)for(let j=i+1;j<route.length;j++){const r2=route.slice(0,i).concat(route.slice(i,j+1).reverse(),route.slice(j+1));const L=pathLen(r2);if(L<best-1e-6){route=r2;best=L;improved=true}}

/* Araç ayarla: araç en az (kapasite − izin verilen boşluk) kadar dolsun; bu sınır içinde en az km.

function planOptions(cap,maxStops,forced,excluded,slack){

  for(let i=0;i<n;i++){const w=W(cand[i].takim);const nx=prev.map(r=>r.slice());
    for(let k=0;k<K;k++)for(let x=0;x+w<=R;x++)if(prev[k][x])nx[k+1][x+w]=1;reach.push(nx);prev=nx}

    const tryS=ns=>{if(!ok(ns))return false;const km=kmOf(ns);if(km<cur-0.5||(Math.abs(km-cur)<=0.5&&loadOf(ns)>loadOf(set))){set=ns;cur=km;better=true;return true}return false};

        for(let p=0;p<set.length;p++)for(let q=p+1;q<set.length;q++)for(const b of out)if(tryS(set.filter(i=>i!==set[p]&&i!==set[q]).concat(b)))break lp;
        for(const b of out)if(tryS(set.concat(b)))break lp;}
    }
    return ok(set)?{set,km:cur,w:loadOf(set)+fw}:null;
  }
  function insertSeed(minW,ratio){let set=[];
    while(loadOf(set)+fw<minW){const order=bestOrder(fixed.concat(set)).order.map(id=>geo(A(id)));const pts=[SUBEN,...order];let best=null,bs=1e18;
      for(const a of cand){if(set.includes(a.id)||set.length>=K||loadOf(set)+fw+W(a.takim)>C)continue;const g=geo(a);let c=1e18;
        for(let i=0;i<pts.length;i++){const nx=pts[i+1];const cc=dist(pts[i],g)+(nx?dist(g,nx)-dist(pts[i],nx):0);if(cc<c)c=cc}
        const sc=ratio?(c+5)/a.takim:c;if(sc<bs){bs=sc;best=a.id}}
      if(!best)break;set.push(best)}
    return set}
  function solve(minW){
    const seeds=[full,insertSeed(minW,true),insertSeed(minW,false)];let best=null;
    for(const sd of seeds){if(loadOf(sd)+fw<minW)continue;const r=search(sd,minW);if(r&&(!best||r.km<best.km-0.5||(Math.abs(r.km-best.km)<=0.5&&r.w>best.w)))best=r}
    return best}
  const levels=[];for(let w=maxW;w>floorW;w-=5)levels.push(w);levels.push(floorW);
  const opts=[];
  for(const lv of [...new Set(levels)]){const r=solve(lv);if(!r)continue;
    if(opts.some(o=>Math.abs(o.km-r.km)<1&&o.w===r.w))continue;
    if(opts.length&&r.km>=opts[opts.length-1].km-5)continue; // daha az dolu ama kısa değilse anlamsız
    opts.push(r)}

}

/* Posta kodu: tüm Avrupa çevrimiçi kontrol edilir (Zippopotam.us, anahtarsız). Sonuçlar telefonda saklanır. */
const PCQ_KEY="sevkiyat-pc";let PCQ={};try{PCQ=JSON.parse(localStorage.getItem(PCQ_KEY))||{}}catch(e){}
function zipPath(cc,code){const d=code.replace(/\D/g,"");
  if(cc==="PL")return d.length===5?d.slice(0,2)+"-"+d.slice(2):null;
  if(cc==="CZ"||cc==="SK")return d.length===5?d.slice(0,3)+"%20"+d.slice(3):null;
  if(cc==="LU")return d.length===4?"L-"+d:null;
  if(cc==="NL")return code.slice(0,4);
  return code}
/* Nominatim (OpenStreetMap adres arama): saniyede en fazla 1 istek kuralına uyulur */
let nomiLast=0;
async function nomi(params){const wait=nomiLast+1100-Date.now();if(wait>0)await new Promise(r=>setTimeout(r,wait));nomiLast=Date.now();
  const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&accept-language=xx&"+params,{referrerPolicy:"strict-origin-when-cross-origin"});
  if(!r.ok)throw new Error(r.status);return r.json()}
const nomiCity=ad=>ad&&(ad.city||ad.town||ad.village||ad.municipality||ad.county)||"";
function nomiCode(cc,code){const d=code.replace(/\D/g,"");if(cc==="CZ"||cc==="SK")return d.slice(0,3)+" "+d.slice(3);if(cc==="PL")return d.slice(0,2)+"-"+d.slice(2);if(cc==="NL"&&code.length===6)return code.slice(0,4)+" "+code.slice(4);return code}
async function lookupOne(cc,code){const k=cc+"-"+code;if(PCQ[k]!==undefined)return PCQ[k];
  const path=zipPath(cc,code);if(!path)return null;
  const r=await fetch(`https://api.zippopotam.us/${cc.toLowerCase()}/${path}`);
  if(r.status===404)return null;if(!r.ok)throw new Error(r.status);
  const j=await r.json(),pl=j.places&&j.places[0];if(!pl)return null;
  return {city:pl["place name"].replace(/\s+-\s+dostava$/,""),lat:+(+pl.latitude).toFixed(4),lon:+(+pl.longitude).toFixed(4)}}
/* Konumu ve şehir adını Nominatim'den iyileştir; olmazsa Zippopotam'ınki kalır */
async function refine(cc,code,v){try{const j=await nomi(`countrycodes=${cc.toLowerCase()}&postalcode=${encodeURIComponent(nomiCode(cc,code))}&limit=1`);
  if(j[0])return {city:nomiCity(j[0].address)||v.city,lat:+(+j[0].lat).toFixed(4),lon:+(+j[0].lon).toFixed(4)}}catch(e){}return v}
function remember(cc,code,v){PCQ[cc+"-"+code]=v;try{localStorage.setItem(PCQ_KEY,JSON.stringify(PCQ))}catch(e){}}
/* Zippopotam'da olmayan kodlar için tek Nominatim araması (tüm ülkeler birden) */
async function nomiAll(code,ccs){const out=[];const seen=new Set();
  const variants=[...new Set(ccs.map(cc=>nomiCode(cc,code)))];
  for(const q of variants){try{const j=await nomi(`countrycodes=${ccs.map(c=>c.toLowerCase()).join(",")}&postalcode=${encodeURIComponent(q)}&limit=10`);
    for(const x of j){const cc=(x.address&&x.address.country_code||"").toUpperCase();if(!ccs.includes(cc)||seen.has(cc))continue;
      const pcode=String(x.address.postcode||"").toUpperCase().replace(/[\s-]/g,"").replace(/^L/,"");if(pcode&&pcode!==code.replace(/^L/,""))continue;
      seen.add(cc);out.push({cc,city:nomiCity(x.address),lat:+(+x.lat).toFixed(4),lon:+(+x.lon).toFixed(4)})}}catch(e){}}
  return out}
async function checkCode(){
  const f=ui.form;const raw=document.getElementById("code").value;

  if(!code){f.check=null;render();return}
  f.check={ok:false,pending:true};f.req=code;
  const lux=/^L\d{4}$/.test(code);const q=lux?code.slice(1):code;f.code=q;
  const ccs=lux?["LU"]:Object.keys(COUNTRIES).filter(cc=>FORMAT[cc].test(code));
  let hits=[],failed=false;
  const fresh=[];
  await Promise.all(ccs.map(async cc=>{const k=cc+"-"+q;if(PCQ[k]){hits.push({cc,...PCQ[k]});return}
    try{const v=await lookupOne(cc,q);if(v){hits.push({cc,...v});fresh.push(cc)}}catch(e){failed=true;const v=PC[k];if(v)hits.push({cc,...v})}}));
  for(const h of hits)if(fresh.includes(h.cc)){Object.assign(h,await refine(h.cc,q,h));remember(h.cc,q,{city:h.city,lat:h.lat,lon:h.lon})}
  if(!hits.length&&!failed){for(const h of await nomiAll(q,ccs)){hits.push(h);remember(h.cc,q,{city:h.city,lat:h.lat,lon:h.lon})}}
  for(const cc of ccs){const v=PC[cc+"-"+q];if(v&&!hits.some(h=>h.cc===cc))hits.push({cc,...v})}
  if(ui.form!==f||f.req!==code)return;
  const order=Object.keys(COUNTRIES);hits.sort((a,b)=>order.indexOf(a.cc)-order.indexOf(b.cc));f.hits=hits;

  else f.check={ok:false,text:failed?"Posta kodu kontrol edilemedi. İnternet bağlantını kontrol et.":`${raw.trim()} hatalı bir posta kodu.`};

/* Durak listesi: telefonda kaydırmadan okunacak kartlar, solda zaman çizgisi */
function stopList(ids,editable){
  let prev=SUBEN,left=ids.reduce((s,id)=>s+A(id).takim,0);const total=left;
  const head=`<li class="stop start"><span class="sn sq">S</span><div class="sc"><div class="sl"><b>Suben gümrük</b><span class="big">${fmtT(total)} <small>takım yüklü</small></span></div></div></li>`;
  const items=ids.map((id,i)=>{const a=A(id),g=geo(a),d=dist(prev,g);prev=g;left-=a.takim;
    const top=`<div class="sl"><span><span class="pc">${esc(a.code)}</span> <span class="ct">${esc(g.city)}</span></span><span class="big">${fmtT(a.takim)} <small>takım</small></span></div>
      <div class="sm"><span>${owner(a.owner).name}</span></div>`;
    if(!editable)return `<li class="stop"><span class="sn">${i+1}</span><div class="sc">${top}</div></li>`;
    return `<li class="stop"><span class="sn">${i+1}</span><div class="sc">
      <dl class="fixed">
        <div><dt>Posta kodu</dt><dd><span class="pc">${esc(a.code)}</span> <span class="ct">${esc(g.city)}</span></dd></div>
        <div><dt>Kimin</dt><dd>${owner(a.owner).name}</dd></div>
        <div><dt>Takım</dt><dd>${fmtT(a.takim)}</dd></div>
      </dl>
      <div class="sf">
        <label>Paket sayısı<input type="text" inputmode="numeric" data-edit="packages" data-id="${id}" value="${esc(a.packages)}"></label>
        <label>Kalan ödeme<input type="text" inputmode="decimal" data-edit="payment" data-id="${id}" value="${esc(a.payment)}"></label>
        <label class="wide-m">Ürünün üstündeki kod<input type="text" autocapitalize="characters" data-edit="productCode" data-id="${id}" value="${esc(a.productCode)}"></label>
      </div>
      
    </div></li>`}).join("");
  return `<ol class="stops">${head}${items}</ol>`;
}
function routeRows(ids,editable,v){
  let prev=SUBEN,left=ids.reduce((s,id)=>s+A(id).takim,0);
  return ids.map((id,i)=>{const a=A(id),g=geo(a),d=dist(prev,g);prev=g;left-=a.takim;
    if(!editable)return `<tr><td><span class="stopno">${i+1}</span></td><td>${addrCell(a)}</td><td>${ownerTag(a.owner)}</td><td class="r mono">${fmtT(a.takim)}</td><td class="r mono">${fmtT(Math.max(0,left))}</td><td class="r mono">${fmtKm(d)}</td></tr>`;
    return `<tr><td><div class="row" style="flex-wrap:nowrap;gap:4px"><span class="stopno">${i+1}</span><span style="display:grid"><button class="btn small" style="padding:0 6px" data-act="up" data-id="${id}" ${i===0?"disabled":""} aria-label="Yukarı">▲</button><button class="btn small" style="padding:0 6px" data-act="down" data-id="${id}" ${i===ids.length-1?"disabled":""} aria-label="Aşağı">▼</button></span></div></td>
     <td>${addrCell(a)}<div class="city">${fmtKm(d)} önceki noktadan</div></td>
     <td><select data-edit="owner" data-id="${id}">${OWNERS.map(o=>`<option value="${o.id}" ${a.owner===o.id?"selected":""}>${o.name}</option>`).join("")}</select></td>
     <td><input type="text" inputmode="decimal" data-edit="takim" data-id="${id}" value="${String(a.takim).replace('.',',')}" style="width:80px"></td>
     <td><input type="text" inputmode="numeric" data-edit="packages" data-id="${id}" value="${esc(a.packages)}" style="width:80px"></td>
     <td><input type="text" data-edit="productCode" data-id="${id}" value="${esc(a.productCode)}" style="width:110px"></td>
     <td><input type="text" inputmode="decimal" data-edit="payment" data-id="${id}" value="${esc(a.payment)}" style="width:100px"></td>
     <td><button class="btn small danger" data-act="unassign" data-id="${id}">Havuza geri</button></td></tr>`}).join("");
}
function loadBar(ids,cap){
  return `<div class="loadbar" title="Yük dağılımı">${ids.map((id,i)=>{const a=A(id);return `<span style="width:${a.takim/cap*100}%;background:var(${owner(a.owner).c})">${i+1}</span>`}).join("")}</div>`;
}

      try{await navigator.share({files:[file],title:name});say("Gönderildi.")}catch(e){if(e.name==="AbortError")say("");else say("Paylaşılamadı. PDF indir ile indirip WhatsApp'tan ekleyebilirsin.",true)}}
    else{doc.download(name);say("Bu cihaz doğrudan paylaşmayı desteklemiyor. PDF indirildi, WhatsApp'ta ataç simgesiyle ekleyebilirsin.")}});
}
/* Kayıt geçmişi bu andan itibaren gösterilir (öncesi deneme kayıtları: silinmedi, veritabanında ve yedekte duruyor) */
const LOG_FROM=1794147598815; // 2026-11-08 17:19
function vGecmis(){
  const day=t=>new Date(t).toDateString(),today=day(Date.now()),yest=day(Date.now()-864e5);
  const dayName=t=>{const d=day(t);return d===today?"Bugün":d===yest?"Dün":new Date(t).toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"})};
  const groups=[];S.log.filter(l=>l.t>=LOG_FROM).forEach(l=>{const k=day(l.t);let g=groups[groups.length-1];if(!g||g.k!==k){g={k,name:dayName(l.t),items:[]};groups.push(g)}g.items.push(l)});
  return `${backBtn()}<div><h2>Kayıt geçmişi</h2></div>
  ${groups.map(g=>`<div class="lgroup"><h3>${g.name}</h3><div class="loglist">${g.items.map(l=>`<div class="lrow"><span class="ltime">${new Date(l.t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</span><div class="lbody"><b>${esc(l.who||"—")}</b><span>${esc(l.txt)}</span></div></div>`).join("")}</div></div>`).join("")}`;
}


/* ---------- Çizim ve olaylar ---------- */
function render(){destroyMaps();renderTop();const m=document.getElementById("app");
  m.innerHTML=!S.user?vLogin():view==="home"?vHome():view==="havuz"?vHavuz():view==="ekle"?vEkle():view==="ayarla"?vAyarla():view==="araclar"?vAraclar():view==="arac"?vArac():vGecmis();
  if(ui.scrollSheet){ui.scrollSheet=false;document.getElementById("sheet")?.scrollIntoView({behavior:"smooth"})};mountMaps()}
const app=document.getElementById("app");
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act,id=b.dataset.id;
  if(b.tagName==="INPUT")return; // checkbox: change olayı
  const f=ui.form,p=ui.plan;
  switch(act){
    case "go":go(b.dataset.to);break;
    case "who":ui.login.who=id;ui.login.err=null;render();break;
    case "login":tryLogin();break;
    case "slack":p.slack=b.dataset.v;render();break;
    case "selopt":p.sel=+b.dataset.v;render();break;
    case "go-ekle":go("ekle");break; case "go-ayarla":go("ayarla");break; case "go-araclar":go("araclar");break;
    case "ask-trash":ui.confirmTrash=id;render();break; case "cancel":ui.confirmTrash=ui.confirmReset=ui.confirmDel=ui.confirmUn=null;render();break;
    case "trash":{const a=A(id);a.status="trash";logIt(`${a.cc} ${a.code} (${owner(a.owner).name}) silindi`);ui.confirmTrash=null;save();render();break}
    case "restore":{const a=A(id);a.status="pool";logIt(`${a.cc} ${a.code} çöp kutusundan havuza geri alındı`);save();render();break}
    case "owner":f.owner=id;f.code=document.getElementById("code").value;render();break;
    case "pickcc":setCountry(id);break;
    case "check":checkCode();break;
    case "qt":f.takim=b.dataset.v;render();break;
    case "cap":p.cap=b.dataset.v;render();break;
    case "usePri":p.usePri=b.dataset.v==="1";if(!p.usePri)p.pri=[];render();break;
    case "useEx":p.useEx=b.dataset.v==="1";if(!p.useEx)p.ex=[];render();break;
    case "plan":{const cap=+String(document.getElementById("cap")?.value??p.cap).replace(",",".")||+p.cap,stops=parseInt(document.getElementById("stops")?.value??p.stops)||+p.stops;
      p.cap=String(cap);p.stops=String(stops);
      if(!(cap>0)||!(stops>0)){p.result={error:"Araç takımı ve adres sayısı 0'dan büyük olmalı."};render();break}
      if(p.busy)break;p.busy=true;b.disabled=true;b.lastChild.textContent="Hesaplanıyor…";
      ensureKm([SUBEN,...S.addresses.filter(a=>a.status==="pool"&&!p.ex.includes(a.id)).map(geo)]).finally(()=>{p.busy=false;if(ui.plan!==p)return;
        p.result=planOptions(cap,stops,p.pri,p.ex,+p.slack);p.sel=p.result.options?p.result.options.length-1:0;p.show=true;render();window.scrollTo({top:0})});break}
    case "editPlan":p.show=false;render();window.scrollTo({top:0});break;
    case "confirmPlan":{const res=p.result,r=res.options[Math.min(p.sel,res.options.length-1)];const v={id:uid(),name:p.name.trim(),cap:res.cap,stops:r.order,status:"hazir",created:Date.now()};
      r.order.forEach(i=>{A(i).status="vehicle";A(i).vehicle=v.id});S.vehicles.push(v);logIt(`${v.name} ayarlandı: ${r.order.length} adres, ${fmtT(r.load)}/${fmtT(res.cap)} takım, ≈ ${fmtKm(r.km)}`);save();go("home");break}
    case "open":{go("arac",{id});const v=S.vehicles.find(x=>x.id===id);if(v)ensureKm([SUBEN,...v.stops.map(i=>geo(A(i)))]).then(()=>{if(view==="arac"&&ui.id===id)softRender()});break}
    case "sheet":ui.sheet=true;ui.pdfMsg=null;ui.scrollSheet=true;render();break;
    case "addExtra":{const v=S.vehicles.find(x=>x.id===ui.id);v.cost=v.cost||{};(v.cost.extras=v.cost.extras||[]).push({label:"",amount:""});save();render();
      const xs=document.querySelectorAll('[data-extra="label"]');xs[xs.length-1]?.focus();break}
    case "delExtra":{const v=S.vehicles.find(x=>x.id===ui.id);const e=v.cost.extras.splice(+b.dataset.i,1)[0];if(e&&(e.label||e.amount))logIt(`${v.name}: ekstra gider kaldırıldı (${e.label||"adsız"} ${e.amount||""})`);save();render();break}
    case "pdfDown":case "pdfShare":pdfAction(b.dataset.act==="pdfShare",b);break;
    case "up":case "down":{const v=S.vehicles.find(x=>x.id===ui.id);const i=v.stops.indexOf(id),j=act==="up"?i-1:i+1;[v.stops[i],v.stops[j]]=[v.stops[j],v.stops[i]];logIt(`${v.name}: sıra elle değiştirildi`);save();render();break}
    case "reroute":{const v=S.vehicles.find(x=>x.id===ui.id);v.stops=bestOrder(v.stops).order;logIt(`${v.name}: rota yeniden hesaplandı`);save();render();break}
    case "unassign":{const v=S.vehicles.find(x=>x.id===ui.id);const a=A(id);v.stops=v.stops.filter(x=>x!==id);a.status="pool";delete a.vehicle;logIt(`${a.cc} ${a.code} ${v.name} aracından kaldırıldı`);ui.confirmUn=null;save();render();break}
    case "addToV":{const sel=document.getElementById("addToV").value;if(!sel)break;const v=S.vehicles.find(x=>x.id===ui.id);const a=A(sel);a.status="vehicle";a.vehicle=v.id;v.stops=bestOrder(v.stops.concat(sel)).order;logIt(`${a.cc} ${a.code} ${v.name} aracına sonradan eklendi`);save();render();break}
    case "ask-delV":ui.confirmDel=1;render();break;
    case "ask-delV2":ui.confirmDel=2;render();break;
    case "setOwner":{const a=A(id);if(a.owner!==b.dataset.v){a.owner=b.dataset.v;logIt(`${a.cc} ${a.code}: kimin → ${owner(a.owner).name}`);save();render()}break}
    case "ask-unassign":ui.confirmUn=id;render();break;
    case "delV":{const v=S.vehicles.find(x=>x.id===ui.id);v.stops.forEach(i=>{A(i).status="pool";delete A(i).vehicle});v.deleted=true;v.stops=[];logIt(`${v.name} silindi, adresleri bekleyen adreslere döndü`);save();go("araclar");break}
  }
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.act==="pick"){const p=ui.plan;const arr=p[t.dataset.key];if(t.checked)arr.push(t.dataset.id);else p[t.dataset.key]=arr.filter(x=>x!==t.dataset.id);
    const c=document.getElementById("cap"),s=document.getElementById("stops");if(c)p.cap=c.value;if(s)p.stops=s.value;render();return}
  if(t.id==="vstatus"){const v=S.vehicles.find(x=>x.id===ui.id);v.status=t.value;logIt(`${v.name} durumu: ${STATUS[t.value][0]}`);save();render();return}
  if(t.dataset.cost||t.dataset.extra){const v=S.vehicles.find(x=>x.id===ui.id);if(!v)return;v.cost=v.cost||{};const raw=t.value.trim();
    const num=k=>{const n=parseNum(raw);return raw===""?"":isNaN(n)?null:String(n)};
    const names={baseKm:"anlaşılan km",price:"sabit fiyat",rate:"ekstra km başına ücret",km:"yapılan km"};
    if(t.dataset.cost){const k=t.dataset.cost,val=num(k);if(val===null){t.value=v.cost[k]??"";return}
      if(String(v.cost[k]??"")!==val){v.cost[k]=val;logIt(`${v.name}: ${names[k]} → ${val||"boş"}`)}
      t.value=val;
      if(k==="km"&&val==="")t.value=Math.round(vehStats(v).km)}
    else{const e=v.cost.extras[+t.dataset.i];const k=t.dataset.extra;const val=k==="amount"?num(k):raw;if(val===null){t.value=e[k];return}
      if(e[k]!==val){e[k]=val;logIt(`${v.name}: ekstra gider ${k==="amount"?"tutarı":"adı"} → ${val||"boş"}`)}t.value=val;}
    save();const box=document.getElementById("costSum");if(box)box.innerHTML=costSummary(v);return}
  if(t.dataset.edit){const a=A(t.dataset.id);const k=t.dataset.edit;let val=t.value;
    if(k==="takim"){val=Math.round((+String(val).replace(",",".")||a.takim)*10)/10}
    if(k==="payment"||k==="packages"){const n=parseNum(val);val=String(val).trim()===""?"":isNaN(n)?a[k]:String(n)}
    const old=a[k];a[k]=val;if(String(old)!==String(val))logIt(`${a.cc} ${a.code}: ${({owner:"kimin",takim:"takım",packages:"paket sayısı",productCode:"ürün kodu",payment:"kalan ödeme"})[k]} → ${k==="owner"?owner(val).name:val||"boş"}`);
    save();render();}
});
app.addEventListener("input",e=>{const t=e.target;
  if(ui.form&&t.id==="code"){ui.form.code=t.value}
  if(ui.form&&t.id==="takim"){ui.form.takim=t.value;const s2=!!ui.form.check?.ok,s3=s2&&+String(t.value).replace(",",".")>0,st=t.closest(".step");if(st){st.classList.toggle("done",s3);st.classList.toggle("active",s2&&!s3);st.querySelector(".n").textContent=s3?"✓":"3"}const btn=document.querySelector('#addForm [type=submit]');if(btn)btn.disabled=!(ui.form.owner&&ui.form.check?.ok&&+String(t.value).replace(",",".")>0)}
  if(ui.plan&&t.id==="cap")ui.plan.cap=t.value; if(ui.plan&&t.id==="stops")ui.plan.stops=t.value;
  if(ui.plan&&t.id==="vname")ui.plan.name=t.value;
  if(ui.plan&&(t.id==="cap"||t.id==="stops"||t.id==="vname")){syncPlanSteps();const b=document.querySelector('[data-act="plan"].big');if(b)b.disabled=!(planReady(ui.plan)&&S.addresses.some(x=>x.status==="pool"))}
});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pw"){e.preventDefault();tryLogin();return}if(e.key==="Enter"&&e.target.id==="code"){e.preventDefault();document.getElementById("takim")?.focus()}});
app.addEventListener("focusout",e=>{if(e.target.id!=="code"||!ui.form)return;const next=e.relatedTarget;
  const raw=e.target.value.toUpperCase().replace(/[\s-]/g,"");if(ui.form.check&&raw===ui.form.code&&(ui.form.check.ok||ui.form.check.multi))return;
  checkCode();if(next&&next.id){const el=document.getElementById(next.id);if(el)el.focus()}else if(next&&next.dataset.act==="pickcc"){}});
app.addEventListener("submit",e=>{e.preventDefault();const f=ui.form;if(!f.check&&document.getElementById("code").value)checkCode();const t=Math.round(+String(f.takim).replace(",",".")*10)/10;
  if(!(f.owner&&f.check?.ok&&f.place&&t>0))return;
  const a={id:uid(),cc:f.cc,code:f.code,city:f.place.city,lat:f.place.lat,lon:f.place.lon,owner:f.owner,takim:t,status:"pool",created:Date.now(),packages:"",payment:"",productCode:""};
  S.addresses.push(a);logIt(`Yeni adres: ${a.cc} ${a.code} (${owner(a.owner).name}), ${fmtT(t)} takım`);save();
  ui={form:{owner:f.owner,cc:f.cc,code:"",takim:"",check:null},added:`Kaydedildi: ${a.code} ${geo(a).city}`};render();document.getElementById("code")?.focus()});
